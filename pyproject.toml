[project]
name = "motionforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dm-control[hdf5]>=1.0.45",
    "jax[cuda13]>=0.10.2",
    "mediapy>=1.2.6",
    "mujoco>=3.12.0",
    "mujoco-mjx[warp]>=3.12.0",
    "pillow>=12.3.0",
    "playground",
    "protobuf<7",
    "tyro>=1.0.16",
    "wandb>=0.29.0",
]

[tool.uv.sources]
playground = { path = "../mujoco_playground", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["motionforge"]

[tool.uv]
package = true
