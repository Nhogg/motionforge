# Tag game rules: mofo.tasks.tag.TagRules (typed; unknown keys fail). Defaults = legacy game.
defaults:
  - schema
  - _self_

arena_half_extent: 4.0  # Square arena half-extent (m): 8 x 8 m.
episode_s: 20.0         # Episode length (s); the timeout is an evader win.
tag_mode: distance      # distance | contact (pursuer's tag_bodies physically touch the evader).
tag_radius: 0.5         # distance mode: base xy distance (m) below which the pursuer tags.
tag_bodies: [pelvis]    # contact mode: pursuer body subtrees (regex) that tag; pelvis = whole
                        # body, '.*_wrist_yaw_link' = hands only. The evader is hit anywhere.
win_reward: 10.0        # Sparse +-reward per episode outcome.
fall_loses: true        # Own fall penalty; physical failures never award opponent game wins.
out_loses: true         # Own OOB penalty; not a TAG or a healthy evader timeout.
