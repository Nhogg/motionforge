# Tag game rules: mofo.tasks.tag.TagRules (typed; unknown keys fail). Defaults = legacy game.
defaults:
  - schema
  - _self_

arena_half_extent: 4.0  # Square arena half-extent (m): 8 x 8 m.
episode_s: 20.0         # Episode length (s); the timeout is an evader win.
tag_mode: distance      # distance | contact (pursuer's tag_bodies physically touch the evader).
tag_radius: 0.5         # distance mode: base xy distance (m) below which the pursuer tags.
tag_bodies: [pelvis]    # contact mode: pursuer body subtrees (regex) that tag; pelvis = whole
                        # body, '.*_wrist_yaw_link' = hands only. The evader is hit anywhere.
win_reward: 10.0        # Sparse +-reward per episode outcome.
fall_loses: true        # Falling loses; false: it ends the episode as a draw.
out_loses: true         # Leaving the arena loses; false: it ends the episode as a draw.
learner_role: random    # random (50/50 per episode) | pursuer | evader (eval).
fall_reward: null       # A seat's total reward when it falls; null: -win_reward (a plain loss).
out_reward: null        # Same for leaving the arena; null: -win_reward.
tag_confirm_s: 0.0      # A tag counts only once the pursuer stays up this long after contact (the
                        # episode runs on; a pursuer fall in the window is its loss). 0: immediate.
alive_reward: 0.0       # Per-step reward per seat while upright.
clock_reward: 0.0       # Zero-sum, per second of game: evader +clock_reward, pursuer -clock_reward.
timeout_wins: true      # The timeout is an evader win; false: a draw (no reward).
regularizers: true      # Stock mjlab regularizers (upright, action rate, ...); false: game rewards only.
reward_weights: {}      # Per-term weight overrides for the stock regularizers, e.g. {upright: 0, action_rate_l2: -0.005}; 0 drops a term.
joint_limit_weight: null  # Stock dof_pos_limits weight (null: stock -1.0); kept even without regularizers.
limit_targets: false    # Clamp actuator position targets to the joint ranges (ctrllimited).
fall_height: null       # Base (pelvis) at or below this height (m) also counts as a fall; null: tilt only.
stance_slip_weight: 0.0 # Per second x mean over the feet of contact x |foot v_xy|^2 (stance feet only; a penalty when < 0).
tilt_weight: 0.0        # Per second x max(torso tilt - tilt_free, 0)^2 (a penalty when < 0).
tilt_free: 0.35         # Torso tilt (rad) that costs nothing: room for a running lean.
decimation: null        # Physics steps per policy step; null: stock 4 (50 Hz at the 5 ms timestep).
