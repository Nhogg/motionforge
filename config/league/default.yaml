# Opponent league: mofo.league.LeagueCfg (typed; unknown keys fail). Defaults = scripted only, no self-play.
#   mofo_train.py tag league.selfplay_frac=0.5 league.groups=8 league.snapshot_every=200
defaults:
  - schema
  - _self_

selfplay_frac: 0.0       # Fraction of envs where the learner plays both seats.
sampling: pfsp           # pfsp: weight (1 - p)^pfsp_power, p = learner's EMA win rate | balanced: p(1 - p) | uniform | recent
pfsp_power: 2.0
win_ema: 0.05            # EMA rate per episode of the learner's win rate vs each member.
init_win: 0.5            # Win rate assumed for an unseen member.
min_weight: 0.02         # Floor on every final sampling probability.
recent_decay: 0.9        # recent: the k-th newest member has weight recent_decay^k.
snapshot_every: 0        # Iterations between learner snapshots (0: off).
max_size: 32             # Pool limit: evicts the oldest non-scripted member (scripted/stage1 stays).
groups: 1                # League env groups, one opponent each.
resample_every: 1200     # Env steps between redraws of each group's opponent.
scripted_weight_start: 1.0  # Scripted weight multiplier, linear from start to end over
scripted_weight_end: 1.0    # scripted_decay_iters iterations (1 -> 1: no effect).
scripted_decay_iters: 1
scripted_share: 0.0      # Probability reserved for scripted members before matchmaking (0: off).
init_pool: []            # Checkpoints preloaded as historical members.
anchor_init_pool: false  # Never evict init_pool members (a fixed opponent ladder).
league_role: random      # Learner role in league-group worlds: random (rules.learner_role) | pursuer | evader.
scripted_role: league    # Learner role vs the scripted member: league (as league_role) | random (rules.learner_role).
ladder: []               # Checkpoints ordered easy -> hard, admitted online as never-evicted rungs.
ladder_active: 1         # Rungs admitted at the start.
ladder_promote: 0.3      # Admit the next rung once the learner's win EMA vs the newest rung reaches this.
ladder_retire: 0.9       # Drop an older rung once its win EMA reaches this (1: never retire).
ladder_min_games: 200    # Recorded games vs a rung before it can trigger promotion or retirement.
ladder_share: 0.0        # Probability reserved for the newest admitted rung, whatever its win rate (0: off).
scripted_speed_start: 1.0 # Training scripted opponent linear command scale; yaw and learned opponents unchanged.
scripted_speed_end: 1.0
scripted_speed_ramp_iters: 1
scripted_speed_ramp_from: 0  # Iteration where the ramp starts (resumed runs continue numbering).
