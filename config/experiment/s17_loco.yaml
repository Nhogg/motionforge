# @package _global_
# 17 h sprint, arm B (locomotion): A plus two penalties, both mirrored onto the opponent seat, no positive
# gait terms: stance foot slip (mean over the feet of contact x |v_xy|^2, swing feet free) and torso tilt
# beyond 20 deg (max(tilt - 0.35, 0)^2). Calibrated on baseline rollouts (results/17h_baseline): slip cost
# 0.7-4.5 /step for the sliding pursuers -> ~0.5-0.8 per episode at -0.1, vs the +-5 game outcome; tilt cost
# 0.004-0.11 /step -> at most ~0.7 per episode at -1.
defaults:
  - s17_base
  - _self_

rules:
  stance_slip_weight: -0.1
  tilt_weight: -1.0
  tilt_free: 0.35

wandb:
  tags: [s17, s17_loco]
