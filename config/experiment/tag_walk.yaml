# @package _global_
# tag_chase_adapt from scratch plus gait shaping (2026-10-23): the R runs learned a sliding shuffle
# with waist flailing (feet air time ~0.05 s, foot slip ~1 m/s, torso tilt 15-30 deg). Adds, on the
# robot's measured velocity (gait.enabled): speed-dependent posture (pose), foot slip, swing-foot
# height and foot air time; and of the stock regularizers keeps the cheap anti-flailing terms (torso
# angular velocity, angular momentum, self collisions). Drops what made B stand still: upright (paid
# for standing) and most of action_rate_l2 (-0.1 cost ~5x the game reward under exploration noise).
defaults:
  - tag_chase_adapt
  - _self_

rules:
  regularizers: true
  reward_weights:
    upright: 0.0
    foot_clearance: 0.0      # foot_swing_height covers it, gated on moving.
    soft_landing: 0.0
    action_rate_l2: -0.005   # 1/20 of stock.

gait:
  enabled: true
  weights:
    pose: 0.5
    foot_slip: -0.25
    foot_swing_height: -0.25
    air_time: 0.25

wandb:
  tags: [tag_chase, tag_chase_adapt, tag_walk]
