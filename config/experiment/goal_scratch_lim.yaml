# @package _global_
# Single-agent baseline for tag_scratch_lim: one G1 reaching goals under a dense progress reward
# (mofo.tasks.goal), no opponent and no tag reward. Everything else as tag_scratch_lim: from
# scratch, same PPO, arena, episode length, fall/exit penalties, joint-limit term and clamped targets.
#   mofo_train.py cmd=tag +experiment=goal_scratch_lim seed=1 cmd.logdir=logs/mofo/goal/goal_scratch_lim/G_s1

task: goal
num_envs: 6144            # = tag's learner seats (4096 robots + 2048 self-play opponents): same batch per iteration.

agent:
  learning_rate: 1.0e-3
  save_interval: 500

cmd:
  iterations: 20000
  log_norms: true        # Loss/*_grad_norm (pre-clip) and *_weight_norm each iteration.

league:
  selfplay_frac: 0.0      # Unused (no opponent).

rules:
  fall_reward: -10.0
  out_reward: -10.0
  regularizers: false     # Progress reward only, plus dof_pos_limits below.
  joint_limit_weight: -0.1
  limit_targets: true
  fall_height: 0.5

shaping:
  enabled: false

wandb:
  tags: [goal_scratch, goal_scratch_lim]
